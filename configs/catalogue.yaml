# AutoRoute model catalogue.
#
# A client sends a `name` below as the request "model" for direct M1-style
# passthrough. Sending router.trigger_model ("auto") instead opts into M2
# routing: the layered router (internal/router) picks a tier and this file's
# `router.tiers` maps that tier to one of the models below.
#
# The `mock` provider needs no API key and is used for local runs, tests and the
# docker-compose demo. Uncomment the openai models once OPENAI_API_KEY is set.

providers:
  mock:
    type: mock

  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

models:
  # --- always available, no key required -------------------------------------
  - name: fast
    provider: mock
    upstream: mock-fast
    price_per_mtok_in: 0.15
    price_per_mtok_out: 0.60

  - name: smart
    provider: mock
    upstream: mock-smart
    price_per_mtok_in: 3.00
    price_per_mtok_out: 15.00

  - name: genius
    provider: mock
    upstream: mock-genius
    price_per_mtok_in: 15.00
    price_per_mtok_out: 75.00

  # --- real upstreams (need OPENAI_API_KEY) ---------------------------------
  # - name: gpt-4o-mini
  #   provider: openai
  #   upstream: gpt-4o-mini
  #   price_per_mtok_in: 0.15
  #   price_per_mtok_out: 0.60
  #
  # - name: gpt-4o
  #   provider: openai
  #   upstream: gpt-4o
  #   price_per_mtok_in: 2.50
  #   price_per_mtok_out: 10.00

# Layered router (M2): "model": "auto" gets classified into a tier by L1
# heuristics, then an optional L2 embedding classifier with confidence bands
# (internal/router). Leaving embedding.model_path/vocab_path blank — or
# building with CGO_ENABLED=0 (the default `make build`) — keeps L2 disabled;
# the router still works, running L1-only and resolving every L1 miss to
# default_tier (degrade-to-passthrough). `make build-router` after `make
# setup` enables the real ONNX-backed L2 classifier.
router:
  enabled: true
  trigger_model: auto
  default_tier: frontier
  # M3: 4th, fixed rung of the fallback chain (cheap -> mid -> frontier ->
  # passthrough_default) once every tier has failed. Distinct from
  # default_tier (that's about routing confidence, M2) even though the demo
  # catalogue happens to point both at the same model.
  passthrough_default: genius
  theta_low: 0.35
  theta_high: 0.70
  tiers:
    cheap: fast
    mid: smart
    frontier: genius
  embedding:
    model_path: models/all-MiniLM-L6-v2/model.onnx
    vocab_path: models/all-MiniLM-L6-v2/vocab.txt
    max_seq_len: 256
    shared_library_path: third_party/onnxruntime/lib/libonnxruntime.dylib

# Per-provider circuit breakers (M3): after breaker_failure_threshold
# consecutive failures a provider is skipped fast (no dispatch attempt) for
# breaker_cooldown before a single probe call decides whether to close again.
# These are the doc's own defaults, made explicit here.
reliability:
  breaker_failure_threshold: 5
  breaker_cooldown: 30s

# Shadow detector (M5): replay a sampled fraction of router-decided
# cheap-tier requests against the frontier model, off the critical path, and
# score how different the two answers are (internal/shadow) — catches a
# well-formed but silently worse cheap answer that no error/latency metric
# would. Requires router.enabled and an available L2 embedder (the same one
# the router already loaded — no second model load); silently disabled
# otherwise (logged, not fatal). sample_rate is high here (20%) so it's easy
# to see fire during a short demo — the mock provider makes every shadow
# call free; a real deployment would tune this down. alert_threshold is the
# doc's own figure and also documents deploy/compose/prometheus-alerts.yml's
# rule.
shadow:
  enabled: true
  sample_rate: 0.2
  alert_threshold: 0.15
