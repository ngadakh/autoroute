# Local demo: the proxy (mock providers, no API key needed) + Prometheus +
# Grafana (pre-provisioned dashboard).
#
#   docker compose -f deploy/compose/docker-compose.yaml up --build
#
#   curl localhost:8080/v1/chat/completions \
#     -H 'content-type: application/json' \
#     -d '{"model":"fast","messages":[{"role":"user","content":"hello"}]}'
#
#   Prometheus UI:  http://localhost:9090
#   Grafana UI:     http://localhost:3000  (admin/admin, dashboard: AutoRoute)

services:
  autoroute:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Liveness/readiness in production is HTTP GET /healthz and /readyz (see
    # deploy/helm). distroless has no shell for a container healthcheck.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    depends_on:
      - autoroute
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
