name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The ONNX embedder tests self-skip without model assets (run `make setup`
      # locally for full coverage). CGo is required by onnxruntime_go.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
