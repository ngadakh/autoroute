name: fmt

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::these files need gofmt:"
            echo "$out"
            exit 1
          fi
