name: release

# Triggered by pushing a version tag (`git tag v0.1.0 && git push origin
# v0.1.0`), not by every push to main — the build/test/lint/fmt workflows
# already gate main, so a tag is expected to point at a commit that's already
# green rather than re-running that here. Builds the same CGO-free image
# `make docker` builds locally, publishes it to GHCR, and cuts a GitHub
# Release with autogenerated notes from the merged PRs since the last tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # to create the GitHub Release
  packages: write # to push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build image
        run: |
          docker build \
            --build-arg VERSION="${{ github.ref_name }}" \
            -t "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            .

      - name: push image
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          docker push "ghcr.io/${{ github.repository }}:latest"

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
