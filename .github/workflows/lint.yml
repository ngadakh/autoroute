name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint must itself be built with a Go version >= go.mod's, and
      # golangci-lint-action@v6 only supports golangci-lint v1 (v7 is needed
      # for v2 — .golangci.yml here uses the v2 config schema). version:
      # latest also resolves to whatever the action has hardcoded as its own
      # default rather than the actual newest release, so pin explicitly and
      # bump by hand when go.mod's Go version moves.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
