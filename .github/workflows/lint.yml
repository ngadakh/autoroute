name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint must itself be built with a Go version >= go.mod's.
      # version: latest resolves to whatever golangci-lint-action has
      # hardcoded as its own default, not the actual newest release — that
      # was v1.64.8 (built with go1.24) when go.mod already said go 1.27,
      # which fails outright ("Go language version used to build
      # golangci-lint is lower than the targeted Go version"). Pin explicitly
      # and bump by hand when go.mod's Go version moves.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
